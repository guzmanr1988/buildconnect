name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_HOMEOWNER_PW: ${{ secrets.VITE_DEMO_HOMEOWNER_PW }}
          VITE_DEMO_VENDOR_PW: ${{ secrets.VITE_DEMO_VENDOR_PW }}
          VITE_DEMO_ADMIN_PW: ${{ secrets.VITE_DEMO_ADMIN_PW }}
          VITE_DEMO_ACCOUNT_REP_PW: ${{ secrets.VITE_DEMO_ACCOUNT_REP_PW }}
          # PR-306 (2026-05-21) — admin_employee demo password mirrors the
          # PR-256 VITE_FINANCING_ENABLED literal pattern. deploy.yml runs
          # on every push to main and is the dominant deploy path (wrangler
          # bypasses CF Pages git integration), so the CF env that hermes
          # provisioned would have been ignored at apex build time. Hardcoded
          # literal so the demo-button launch state is durable without out-
          # of-band repo-secret configuration. Demo password is effectively
          # public (clickable button with no entry) — no security cost.
          VITE_DEMO_EMPLOYEE_PW: 'demo-employee-Spring2026!'
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # PR-256 (2026-05-17) — financing-flag launch state. Pre-fix this
          # workflow lacked both vars in the build env, so every CF Pages
          # build since Rod's 2026-05-17 01:50Z STEP-2 wrangler-bypass
          # silently rebuilt the bundle with VITE_FINANCING_ENABLED unset
          # → isFinancingEnabled() === false → FinancingCard short-circuits.
          # Hardcoded literals (not secrets) so the launch state is durable
          # without out-of-band repo-settings configuration. Flip OFF for
          # rollback = edit this file's literal to 'false' (1-line PR).
          VITE_FINANCING_ENABLED: 'true'
          VITE_FINANCING_BANK: 'manual_referral'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=buildconnect --branch=main
