name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_HOMEOWNER_PW: ${{ secrets.VITE_DEMO_HOMEOWNER_PW }}
          VITE_DEMO_VENDOR_PW: ${{ secrets.VITE_DEMO_VENDOR_PW }}
          VITE_DEMO_ADMIN_PW: ${{ secrets.VITE_DEMO_ADMIN_PW }}
          VITE_DEMO_ACCOUNT_REP_PW: ${{ secrets.VITE_DEMO_ACCOUNT_REP_PW }}
          VITE_DEMO_MODE: ${{ secrets.VITE_DEMO_MODE }}
          # PR-306 (2026-05-21) — admin_employee demo password mirrors the
          # PR-256 VITE_FINANCING_ENABLED literal pattern. deploy.yml runs
          # on every push to main and is the dominant deploy path (wrangler
          # bypasses CF Pages git integration), so the CF env that hermes
          # provisioned would have been ignored at apex build time. Hardcoded
          # literal so the demo-button launch state is durable without out-
          # of-band repo-secret configuration. Demo password is effectively
          # public (clickable button with no entry) — no security cost.
          VITE_DEMO_EMPLOYEE_PW: 'demo-employee-Spring2026!'
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # 2026-08-16 — Stripe publishable key. Until today this var was NOT in
          # this env block at all, so every production build shipped with an
          # EMPTY key: the served bundle carried pk_live x0 AND pk_test x0
          # (positive control 'stripe' x83, negative control 0). Card payments
          # have therefore never worked on the apex, in either mode. An earlier
          # note recorded the bundle as carrying "pk_test x1" — that count was
          # the @stripe/stripe-js library's own /^pk_test/ validation regex, not
          # a key, so this is a FIRST wiring rather than a test->live cutover.
          #
          # Publishable keys are designed to ship to browsers, so VITE_ prefix
          # is correct here. The SECRET key must never appear in this block:
          # every VITE_ var in it is emitted into the public bundle whether or
          # not any source reads it (that is how the five demo passwords above
          # leaked — see PR #578). STRIPE_SECRET_KEY goes to Supabase edge-fn
          # secrets via `supabase secrets set`, and nowhere else.
          #
          # Source reads VITE_STRIPE_PUBLISHABLE_KEY first, falling back to
          # VITE_STRIPE_PUBLIC_KEY (src/lib/stripe-client.ts) — set the
          # PUBLISHABLE spelling.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=buildconnect --branch=main
